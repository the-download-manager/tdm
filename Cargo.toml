[package]
name = "tdm"
version = "0.7.3"
edition = "2021"
description = "TDM - The Download Manager: segmented download manager with a classic-style GUI"
authors = ["G. Thilina Dinesh Perera"]
license = "MIT"
repository = "https://github.com/the-download-manager/tdm"
homepage = "https://github.com/the-download-manager/tdm"
readme = "README.md"

[lib]
name = "tdm"
path = "src/lib.rs"

# GUI binary: built as a Windows GUI subsystem app, so double-clicking it never
# opens a console window.
[[bin]]
name = "tdm"
path = "src/main_gui.rs"

# Console binary for scripting: normal terminal behaviour.
[[bin]]
name = "tdm-cli"
path = "src/main_cli.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "native-tls",
    "cookies",
    "stream",
    "json",
    "http2",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
url = "2"
futures-util = "0.3"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
roxmltree = "0.20"
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui_extras = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
